<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Hotspot</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/hotspot.css?v=4">
<script>/* conf.js always fresh (the router caches static files for a year) */ document.write('<script src="/conf.js?t=' + new Date().getTime() + '"><\/script>');</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img id="logo" alt="">
    <h1 class="js-name">Hotspot</h1>
  </div>
  <div class="card center">
    <span class="badge warn" data-t="bye">Anda sudah keluar</span>
    <div class="big" style="font-size:26px;margin-top:10px">$(username)</div>
  </div>
  <div class="card">
    <div class="kv"><span data-t="uptime">Lama terhubung</span><span>$(uptime)</span></div>
    <div class="kv"><span data-t="used">Pemakaian</span><span>$(bytes-in-nice) / $(bytes-out-nice)</span></div>
    $(if session-time-left)
    <div class="kv"><span data-t="left">Sisa waktu</span><span>$(session-time-left)</span></div>
    $(endif)
    <div class="kv"><span data-t="ip">IP</span><span>$(ip)</span></div>
    <div class="kv"><span data-t="mac">MAC</span><span>$(mac)</span></div>
  </div>
  <a class="btn" href="$(link-login)" data-t="again">Masuk lagi</a>
  <div class="foot" id="foot">$(hostname)</div>
</div>
<script src="/js/hotspot.js?v=4"></script>
<script>HS.init();</script>
</body>
</html>
