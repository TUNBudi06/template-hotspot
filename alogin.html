<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta http-equiv="refresh" content="3; url=$(link-redirect)">
<title>Hotspot</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/hotspot.css?v=5">
<script>/* conf.js always fresh (the router caches static files for a year) */ document.write('<script src="/conf.js?t=' + new Date().getTime() + '"><\/script>');</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img id="logo" alt="">
    <h1 class="js-name">Hotspot</h1>
  </div>
  <div class="card center">
    <div class="alert ok" data-t="success">Berhasil masuk!</div>
    <div class="big" style="font-size:26px">$(username)</div>
    <p class="muted"><span class="spin"></span> <span data-t="redirecting">Mengalihkan...</span></p>
  </div>
  <a class="btn" href="$(link-redirect)" data-t="continuebtn">Lanjut browsing</a>
  <a class="btn ghost" href="$(link-status)" data-t="statuspage">Lihat status</a>
  <div class="foot" id="foot">$(hostname)</div>
</div>
<script src="/js/hotspot.js?v=5"></script>
<script>HS.init();</script>
</body>
</html>
