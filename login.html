<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Hotspot</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/hotspot.css">
<script src="/conf.js"></script>
</head>
<body>
$(if chap-id)
<!-- CHAP: the password is hashed in the browser before it is sent -->
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
  <input type="hidden" name="username">
  <input type="hidden" name="password">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>
<script src="/md5.js"></script>
<script>var HS_CHAP = { id: '$(chap-id)', challenge: '$(chap-challenge)' };</script>
$(endif)

<div class="wrap">
  <div class="brand">
    <img id="logo" alt="">
    <h1 class="js-name">Hotspot</h1>
    <p>$(identity)</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button type="button" id="tabV" data-t="voucher">Voucher</button>
      <button type="button" id="tabM" data-t="member">Member</button>
    </div>

    $(if error)
    <div class="alert bad" id="err">$(error)</div>
    $(endif)
    <div class="alert info" id="info"></div>

    <form name="login" action="$(link-login-only)" method="post" autocomplete="off">
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">
      <label for="username" id="lblUser">Kode Voucher</label>
      <input class="field" id="username" name="username" type="text" value="$(username)" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
      <div class="pw" id="rowPass">
        <label for="password" data-t="pass">Password</label>
        <input class="field" id="password" name="password" type="password" placeholder="Password">
        <button type="button" class="eye" id="eye" data-t="show">show</button>
      </div>
      <button class="btn" id="btnLogin" type="submit" data-t="login">Masuk</button>
    </form>
    $(if trial == 'yes')
    <a class="btn ghost" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" data-t="trial">Coba gratis</a>
    $(endif)
  </div>

  <div class="card">
    <h2 data-t="how">Cara pakai</h2>
    <ol class="steps">
      <li><span data-t="s1"></span> <b>"<span class="js-wifi"></span>"</b></li>
      <li data-t="s2"></li>
      <li data-t="s3"></li>
    </ol>
    <p class="center small" style="margin:12px 0 0"><a id="checkLink" href="#" data-t="check">Cek sisa voucher</a></p>
  </div>

  <div class="card hide" id="prices">
    <h2 data-t="prices">Daftar Harga</h2>
    <div id="priceTable"></div>
  </div>

  <div class="foot" id="foot">$(hostname)</div>
</div>

<script src="/js/hotspot.js"></script>
<script>HS.login({ error: document.getElementById('err') !== null });</script>
</body>
</html>
