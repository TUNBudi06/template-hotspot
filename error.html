<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Hotspot</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/hotspot.css?v=5">
<script>/* conf.js always fresh (the router caches static files for a year) */ document.write('<script src="/conf.js?t=' + new Date().getTime() + '"><\/script>');</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img id="logo" alt="">
    <h1 class="js-name">Hotspot</h1>
  </div>
  <div class="card">
    <h2 data-t="err">Terjadi kesalahan</h2>
    <div class="alert bad">$(error)</div>
    <a class="btn" href="$(link-login-only)" data-t="back">Kembali</a>
  </div>
  <div class="foot" id="foot">$(hostname)</div>
</div>
<script src="/js/hotspot.js?v=5"></script>
<script>HS.init();</script>
</body>
</html>
